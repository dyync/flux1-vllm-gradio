events {}

http {
    upstream flux {
        # least_conn: generation takes seconds, so route to the replica with the fewest in-flight requests
        least_conn;
        server vllm-gpu0:8091 max_fails=3 fail_timeout=30s;
        server vllm-gpu1:8091 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8091;
        client_max_body_size 20m;

        location / {
            proxy_pass http://flux;
            proxy_read_timeout 600s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
